<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>مساعد تقرير SEO لصفحات SharePoint</title>
  <style>
    :root{--dark:#005d45;--main:#2e7a67;--bg:#eef7f3;--surface:#fff;--text:#1f2a27;--muted:#64736d;--line:#d5e3de;--danger:#a62b1b}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7fbf9,var(--bg));color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8}
    .container{width:min(920px,calc(100% - 24px));margin:auto;padding:24px 0 50px}.hero,.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px #003c2d0d}.hero{padding:30px;color:#fff;background:linear-gradient(135deg,var(--dark),var(--main));margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,36px);line-height:1.4}.hero p{margin:0;color:#eaf7f2}.card{padding:24px;margin-bottom:18px}.section-title{margin:0 0 6px;color:var(--dark);font-size:21px}.description,.hint{color:var(--muted);font-size:13px}.description{margin:0 0 18px}.field{margin-bottom:16px}label{display:block;font-weight:bold;margin-bottom:7px;font-size:14px}input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font:inherit;color:var(--text);background:#fff}input:focus,textarea:focus{outline:3px solid #2e7a6720;border-color:var(--main)}textarea{min-height:120px;resize:vertical}.button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:11px;padding:12px 18px;font:inherit;font-weight:bold;cursor:pointer}.primary{background:var(--dark);color:#fff}.secondary{background:#edf6f2;color:var(--dark);border:1px solid var(--line)}button:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:13px}.status.show{display:block}.status.error{background:#fff0ed;color:var(--danger);border:1px solid #e7c5ba}.status.success{background:#eaf7ee;color:#176b35;border:1px solid #b9dec4}.report{display:none}.report.show{display:block}.score{display:flex;align-items:center;gap:15px;background:#f3f8f6;border:1px solid var(--line);padding:16px;border-radius:14px;margin-bottom:14px}.score-number{font-size:34px;font-weight:bold;color:var(--dark)}.report-block{border-top:1px solid var(--line);padding:15px 0}.report-block:first-child{border-top:0}.report-block h3{margin:0 0 7px;color:var(--dark);font-size:17px}.report-block p{margin:0}.report-block ul{margin:5px 0 0;padding-right:22px}.finding{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fbfdfc}.finding strong{color:var(--dark)}.meta{background:#15201d;color:#e9f5f1;padding:14px;border-radius:10px;white-space:pre-wrap;direction:rtl}.footer{text-align:center;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>🔎 مساعد تقرير SEO لصفحات SharePoint</h1>
      <p>أدخل رابطًا عامًا، اكتب طلبك، وستظهر الصياغة النهائية للتقرير داخل الصفحة.</p>
    </header>

    <section class="card">
      <h2 class="section-title">ابدأ الفحص</h2>
      <p class="description">يجب أن تكون صفحة SharePoint منشورة ومتاحة بدون تسجيل دخول.</p>
      <div class="field">
        <label for="pageUrl">رابط الصفحة</label>
        <input id="pageUrl" type="url" dir="ltr" placeholder="https://example.sharepoint.com/..." autocomplete="off">
      </div>
      <div class="field">
        <label for="question">ماذا تريد من ChatGPT؟</label>
        <textarea id="question">اكتب تقرير SEO نهائيًا باللغة العربية، مع ملخص تنفيذي، أهم الملاحظات، نقاط القوة، التوصيات، وSEO Title وMeta Description وALT للصورة المقترحة.</textarea>
      </div>
      <div class="button-row">
        <button id="analyzeButton" class="primary">🔎 تحليل وإعداد التقرير</button>
        <button id="clearButton" class="secondary" type="button">مسح</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </section>

    <section id="reportCard" class="card report" aria-live="polite">
      <h2 class="section-title">التقرير النهائي</h2>
      <div id="reportContent"></div>
      <div class="button-row">
        <button id="copyButton" class="secondary">📋 نسخ التقرير</button>
        <button id="printButton" class="secondary">🖨️ طباعة / حفظ PDF</button>
      </div>
    </section>
    <p class="footer">لا تدخل بيانات شخصية أو سرية. يتم إرسال رابط الصفحة وطلبك إلى خادم التحليل.</p>
  </main>

  <script>
    // بعد نشر Backend على Vercel، استبدل القيمة التالية برابطه.
    const API_URL = "https://YOUR-VERCEL-PROJECT.vercel.app/api/analyze";
    const $ = id => document.getElementById(id);
    let latestReportText = "";

    function text(value) { return value == null ? "" : String(value); }
    function list(items) { return Array.isArray(items) ? items : []; }
    function addList(title, items) {
      if (!list(items).length) return "";
      return `<div class="report-block"><h3>${text(title)}</h3><ul>${list(items).map(item => `<li>${text(item)}</li>`).join("")}</ul></div>`;
    }
    function renderReport(report) {
      const findings = list(report.importantFindings).map(item => {
        if (typeof item === "string") return `<li>${text(item)}</li>`;
        return `<li class="finding"><strong>${text(item.priority || "ملاحظة")}</strong> — ${text(item.finding)}<br><small>الأثر: ${text(item.impact)}<br>الإجراء: ${text(item.action)}</small></li>`;
      }).join("");
      const meta = report.suggestedMetadata || {};
      const data = report.extractedData || {};
      const html = `<div class="score"><div class="score-number">${text(report.score ?? "—")}</div><div><strong>${text(report.readiness?.status || "نتيجة الفحص")}</strong><br>${text(report.readiness?.summary || "")}</div></div>
        <div class="report-block"><h3>الملخص التنفيذي</h3><p>${text(report.executiveSummary || report.summary)}</p></div>
        ${addList("نقاط القوة", report.strengths)}
        ${findings ? `<div class="report-block"><h3>أهم الملاحظات</h3><ul>${findings}</ul></div>` : ""}
        ${addList("تحليل SEO الفني", report.technicalSeo)}
        ${addList("تحليل المحتوى", report.contentAnalysis)}
        ${addList("تحليل العناوين والصور والروابط", [...list(report.headingsAnalysis), ...list(report.imagesAnalysis), ...list(report.linksAnalysis)])}
        ${addList("التوصيات النهائية", report.finalRecommendations || report.recommendations)}
        <div class="report-block"><h3>الصياغات المقترحة</h3><div class="meta">SEO Title: ${text(meta.seoTitle)}\n\nMeta Description: ${text(meta.metaDescription)}\n\nALT: ${text(meta.imageAlt)}</div></div>
        ${addList("خطة العمل", [...list(report.actionPlan?.urgent), ...list(report.actionPlan?.important), ...list(report.actionPlan?.optional)])}
        ${report.officialConclusion ? `<div class="report-block"><h3>الخلاصة الرسمية</h3><p>${text(report.officialConclusion)}</p></div>` : ""}
        <details class="report-block"><summary>البيانات المستخرجة</summary><pre>${text(JSON.stringify(data, null, 2))}</pre></details>`;
      $("reportContent").innerHTML = html;
      $("reportCard").classList.add("show");
      latestReportText = $("reportContent").innerText;
    }
    function showStatus(message, type) { $("status").textContent = message; $("status").className = `status show ${type}`; }

    $("analyzeButton").addEventListener("click", async () => {
      const url = $("pageUrl").value.trim();
      const question = $("question").value.trim();
      if (API_URL.includes("YOUR-VERCEL-PROJECT")) return showStatus("أكمل نشر Backend على Vercel ثم ضع رابط /api/analyze داخل الكود.", "error");
      try { const parsed = new URL(url); if (parsed.protocol !== "https:") throw new Error(); } catch { return showStatus("أدخل رابط HTTPS صحيحًا.", "error"); }
      if (!question) return showStatus("اكتب السؤال أو المطلوب.", "error");
      $("analyzeButton").disabled = true; $("reportCard").classList.remove("show"); showStatus("جارٍ قراءة الصفحة وإعداد التقرير...", "success");
      try {
        const response = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url, question}) });
        const result = await response.json(); if (!response.ok) throw new Error(result.error || "تعذر إكمال الفحص.");
        renderReport(result.report || result); showStatus("اكتمل التقرير.", "success");
      } catch (error) { showStatus(error.message || "حدث خطأ غير متوقع.", "error"); }
      finally { $("analyzeButton").disabled = false; }
    });
    $("clearButton").addEventListener("click", () => { $("pageUrl").value = ""; $("reportCard").classList.remove("show"); $("status").className = "status"; });
    $("copyButton").addEventListener("click", async () => { await navigator.clipboard.writeText(latestReportText); showStatus("تم نسخ التقرير.", "success"); });
    $("printButton").addEventListener("click", () => window.print());
  </script>
</body>
</html>
