<div class="card">
  <h2>فحص صفحة SharePoint</h2>

  <label for="url">رابط الصفحة</label>

  <input
    id="url"
    type="url"
    placeholder="https://example.sharepoint.com/sites/site/page.aspx"
  >

  <button id="analyzeBtn">
    🔎 ابدأ الفحص
  </button>

  <div id="status"></div>
  <div id="result"></div>
</div>

<script>
  const analyzeBtn = document.getElementById("analyzeBtn");
  const urlInput = document.getElementById("url");
  const statusBox = document.getElementById("status");
  const resultBox = document.getElementById("result");

  analyzeBtn.addEventListener("click", async () => {
    const url = urlInput.value.trim();

    if (!url) {
      statusBox.textContent = "يرجى إدخال رابط الصفحة.";
      return;
    }

    try {
      new URL(url);
    } catch {
      statusBox.textContent = "الرابط غير صحيح.";
      return;
    }

    analyzeBtn.disabled = true;
    statusBox.textContent = "جارٍ قراءة الصفحة وتحليلها...";
    resultBox.innerHTML = "";

    try {
      const response = await fetch(
        "https://YOUR-BACKEND-DOMAIN.vercel.app/api/analyze",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ url })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "حدث خطأ أثناء الفحص.");
      }

      resultBox.innerHTML = `
        <h2>${escapeHtml(data.title)}</h2>
        <p><strong>النتيجة العامة:</strong> ${data.score}/100</p>
        <p>${escapeHtml(data.summary)}</p>

        <h3>أهم الملاحظات</h3>
        <ul>
          ${data.importantFindings.map(item =>
            `<li>${escapeHtml(item)}</li>`
          ).join("")}
        </ul>

        <h3>التوصيات</h3>
        <ul>
          ${data.recommendations.map(item =>
            `<li>${escapeHtml(item)}</li>`
          ).join("")}
        </ul>
      `;

      statusBox.textContent = "اكتمل الفحص بنجاح.";
    } catch (error) {
      statusBox.textContent = error.message;
    } finally {
      analyzeBtn.disabled = false;
    }
  });

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>
